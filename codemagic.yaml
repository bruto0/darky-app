# Codemagic CI/CD for D'arky — iOS only.
#
# Workflows:
#   * ios-checks  — automatic analyze + unit tests on push / pull request.
#   * ios-release — manual signed IPA build; no TestFlight/App Store publishing.
#
# Signing is manual, with the .p12 certificate and .mobileprovision profile
# uploaded to Codemagic under:
#   Team settings -> codemagic.yaml settings -> Code signing identities
#
# Upload a matching App Store distribution certificate (.p12) and an App Store
# provisioning profile for bundle ID ru.darky.dance. Codemagic fetches the
# matching files automatically because distribution_type and bundle_identifier
# are set below. No certificate or profile is committed to this repository.
#
# The workflow intentionally has no Android jobs.

workflows:
  ios-checks:
    name: iOS checks
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      flutter: 3.50.0
      xcode: latest
      cocoapods: default
      cache:
        cache_paths:
          - $HOME/.pub-cache
          - $HOME/Library/Caches/CocoaPods
          - $HOME/Library/Developer/Xcode/DerivedData
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
    scripts:
      - name: Flutter doctor
        script: flutter doctor -v
      - name: Get Flutter packages
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/app"
          flutter pub get
      - name: Analyze and unit tests
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/app"
          flutter analyze
          flutter test

  ios-release:
    name: iOS signed IPA
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.50.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ru.darky.dance
      cache:
        cache_paths:
          - $HOME/.pub-cache
          - $HOME/Library/Caches/CocoaPods
          - $HOME/Library/Developer/Xcode/DerivedData
    # No triggering block: this workflow is started manually from Codemagic.
    scripts:
      - name: Flutter doctor
        script: flutter doctor -v
      - name: Get Flutter packages
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/app"
          flutter pub get
      - name: Verify and unit tests
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/app"
          flutter analyze
          flutter test
      - name: Install CocoaPods
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/app/ios"
          pod install --repo-update
      - name: Configure iOS code signing
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/app"
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/app"
          flutter build ipa --release
    artifacts:
      - app/build/ios/ipa/*.ipa
      - app/build/ios/archive/*.xcarchive
