<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>D'arky — FAB spec</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0e0d12; font-family: 'Manrope', sans-serif; }
  .screen {
    width: 390px; height: 844px; position: relative; overflow: hidden;
    background: #f8f5f8; color: #18141d;
  }
  .spec-title { position: absolute; left: 20px; top: 16px; font-size: 17px; font-weight: 800; letter-spacing: -.03em; }
  .spec-sub { position: absolute; left: 20px; top: 42px; font-size: 9.5px; font-weight: 500; color: #8d8697; }
  .safe {
    position: absolute; left: 12px; top: 78px; width: 366px; height: 670px;
    border: 1.5px dashed #c27ba0; border-radius: 24px;
  }
  .safe span {
    position: absolute; left: 74px; top: 10px; font-size: 8.5px; font-weight: 700;
    color: #9e5b7e; letter-spacing: .06em; text-transform: uppercase;
  }
  .ghost {
    position: absolute; width: 52px; height: 52px; border-radius: 50%;
    border: 1.5px dashed rgba(194,123,160,.7); background: rgba(194,123,160,.08);
  }
  .fab {
    position: absolute; left: 314px; top: 684px; width: 52px; height: 52px; border-radius: 50%;
    background: #18141d; color: #f8f5f8; display: grid; place-items: center;
    box-shadow: 0 10px 24px rgba(10,8,14,.26);
  }
  .fab svg { width: 22px; height: 22px; }
  .fab-label { position: absolute; left: 286px; top: 662px; font-size: 8.5px; font-weight: 600; color: #8d8697; }
  .nav {
    position: absolute; left: 0; right: 0; bottom: 0; height: 84px;
    background: #fff; border-top: 1px solid #ece7ef;
    display: flex; align-items: center; padding: 9px 10px 18px;
  }
  .nav div { flex: 1; text-align: center; font-size: 9px; font-weight: 700; color: #8d8697; }
  .nav div::before {
    content: ''; display: block; width: 21px; height: 21px; margin: 0 auto 4px;
    border: 1.5px solid #b9b1c2; border-radius: 5px;
  }
  .nav div:first-child { color: #9e5b7e; }
  .nav div:first-child::before { border-color: #c27ba0; }
  .note {
    position: absolute; left: 20px; right: 20px; top: 60px;
    font-size: 8.5px; font-weight: 600; color: #9e5b7e; text-align: center;
  }
  .arrows { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<section class="screen" id="fab-spec">
  <div class="spec-title">FAB обновления расписания</div>
  <div class="spec-sub">52 dp · тап — обновить · перетаскивание — позиция</div>

  <div class="safe"><span>safe area</span></div>

  <svg class="arrows" width="390" height="844" viewBox="0 0 390 844">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="#c27ba0"/>
      </marker>
    </defs>
    <path d="M340 704 L340 136" fill="none" stroke="#c27ba0" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)" opacity=".65"/>
    <path d="M338 710 L70 710" fill="none" stroke="#c27ba0" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)" opacity=".65"/>
  </svg>

  <div class="ghost" style="left:12px; top:78px"></div>
  <div class="ghost" style="left:314px; top:78px"></div>
  <div class="ghost" style="left:12px; top:684px"></div>

  <div class="fab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 7v5h-5"/><path d="M19 12a7 7 0 1 0-1.2 5.2"/>
    </svg>
  </div>
  <div class="fab-label">по умолчанию</div>

  <div class="note">Круг всегда целиком внутри safe area — даже частично за край нельзя</div>

  <div class="nav">
    <div>Абонемент</div>
    <div>Посещения</div>
    <div>Покупки</div>
    <div>Записи</div>
  </div>
</section>
</body>
</html>
