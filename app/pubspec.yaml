name: dance
description: "D'arky — мобильное приложение клиента D'arky Dance."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: 2.6.1
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  path_provider: ^2.1.6
  brotli_fast: ^1.0.0
  just_zstd: ^0.3.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/fonts/OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
